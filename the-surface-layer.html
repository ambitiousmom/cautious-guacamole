<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Surface Layer</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .wrap {
    max-width: 740px;
    margin: 0 auto;
    padding: 48px 28px 180px;
  }

  /* ── Header ── */
  header {
    text-align: center;
    padding-bottom: 48px;
    margin-bottom: 56px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.1);
  }
  header h1 {
    font-size: 34px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: -0.03em;
  }
  header .sub {
    font-size: 15px;
    color: #64748b;
    margin-top: 8px;
  }

  /* ── Steps ── */
  .step {
    margin-bottom: 60px;
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .step.visible {
    opacity: 1;
    transform: none;
  }

  /* ── Learning label ── */
  .label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #0ea5e9;
    margin-bottom: 16px;
    padding-left: 26px;
  }

  /* ── Agent message ── */
  .agent {
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .dot {
    width: 10px;
    height: 10px;
    background: linear-gradient(135deg, #0ea5e9, #06b6d4);
    border-radius: 50%;
    margin-top: 8px;
    flex-shrink: 0;
  }
  .bubble p {
    font-size: 16px;
    color: #cbd5e1;
    margin-bottom: 10px;
  }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble strong { color: #38bdf8; font-weight: 600; }
  .bubble em { color: #94a3b8; }

  /* ── Prototype embed ── */
  .proto {
    margin: 24px 0 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #1e293b;
    background: #1e293b;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
  }
  .proto-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid #334155;
  }
  .proto-name {
    font-size: 12px;
    font-weight: 600;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .proto-link {
    font-size: 12px;
    color: #38bdf8;
    text-decoration: none;
  }
  .proto-link:hover { text-decoration: underline; }
  .proto iframe {
    width: 100%;
    height: 520px;
    border: none;
    background: #fff;
    display: block;
  }

  /* ── Continue ── */
  .nav {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .nav button {
    background: none;
    border: 1px solid #334155;
    color: #94a3b8;
    padding: 9px 24px;
    font-size: 14px;
    font-family: inherit;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .nav button:hover {
    border-color: #0ea5e9;
    color: #e2e8f0;
    background: rgba(14, 165, 233, 0.06);
  }
  .nav button:disabled {
    opacity: 0.25;
    pointer-events: none;
  }
  .counter {
    font-size: 12px;
    color: #475569;
  }

  /* ── Typing dots ── */
  .typing {
    display: flex;
    gap: 5px;
    padding: 8px 0 8px 26px;
    margin-bottom: 12px;
  }
  .typing span {
    width: 7px;
    height: 7px;
    background: #475569;
    border-radius: 50%;
    animation: blink 1.4s infinite both;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* ── Final step ── */
  .step.final .bubble p {
    font-size: 18px;
    color: #f1f5f9;
    line-height: 1.75;
  }
  .step.final .closing {
    margin-top: 20px;
    font-size: 22px;
    font-weight: 600;
    color: #f8fafc;
    letter-spacing: -0.01em;
  }

  /* ── Footnote ── */
  .footnote {
    margin-top: 80px;
    text-align: center;
    font-size: 12px;
    color: #334155;
    letter-spacing: 0.04em;
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .wrap { padding: 32px 16px 120px; }
    header h1 { font-size: 26px; }
    .proto iframe { height: 360px; }
    .step.final .bubble p { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .step { transition: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Surface Layer</h1>
    <p class="sub">An agent-guided walkthrough</p>
  </header>
  <div id="chat"></div>
</div>

<script>
const steps = [
  // 0 — Intro
  {
    messages: [
      "Hello, Omar.",
      "I'm an agent Hema built to walk you through her work. Not slides. Not a spec. Working prototypes for the surface layer of the agent harness — the part your Lobster post describes from the runtime up, but not from the UI down."
    ]
  },
  // 1 — The Gap
  {
    label: "THE GAP",
    messages: [
      "You wrote eight learnings from living with Lobster. Number one: <strong>\"The harness matters as much as the model.\"</strong>",
      "You mapped the harness beautifully from the inside out — memory, security, plugins, nine agents, dream cycles at 4 AM. But what does the harness look like from the user's side? What happens when an always-on agent lives inside Word, Excel, and PowerPoint?",
      "That's what these prototypes explore."
    ]
  },
  // 2 — Layer Model
  {
    label: "LEARNING #1 — THE HARNESS MATTERS AS MUCH AS THE MODEL",
    messages: [
      "The architecture — what the harness owns, what it consumes from Copilot App, and where the throwaway risk sits."
    ],
    prototype: {
      title: "Four-Tier Layer Model",
      url: "agent_harness_ux_foundation.html"
    }
  },
  // 3 — One Copilot
  {
    label: "LEARNING #6 — INTEGRATION DEPTH BEATS BREADTH",
    messages: [
      "One unified surface — same Copilot whether you're in the standalone app or inside a document.",
      "Only three things change per app: a 3px color stripe, the header context, and the Peek label. Everything else is platform."
    ],
    prototype: {
      title: "One Copilot — Unified Surface",
      url: "one-copi.html"
    }
  },
  // 4 — Chat History
  {
    label: "LEARNING #2 — MEMORY IS MULTI-LAYERED",
    messages: [
      "On the UX side, memory means chat history survives across surfaces. When someone opens an Excel file from a Copilot chat, that chat follows them into the pane.",
      "Same chat, different surface, no context loss. These aren't mockups — they're product rules with real interaction logic."
    ],
    prototype: {
      title: "Chat History Continuity",
      url: "tempChatHistory.html"
    }
  },
  // 5 — Voice
  {
    label: "LEARNING #5 — AGENTS NEED IDENTITY",
    messages: [
      "You added voice to Lobster through ElevenLabs — <em>\"same agent, same memory, same tools, just spoken instead of typed.\"</em>",
      "Here's what voice-first editing looks like in Word. Not transcription — compositional voice with confidence levels and audience adaptation."
    ],
    prototype: {
      title: "Voice-First Editing",
      url: "voice-edit.html"
    }
  },
  // 6 — Work Tasks
  {
    label: "LEARNING #7 — PROACTIVE BEATS REACTIVE",
    messages: [
      "The UX for your Chief of Staff agent — the one that prepares your day before you wake up, triages your inbox while you're in meetings, and follows up without being asked."
    ],
    prototype: {
      title: "Work Tasks Dispatcher",
      url: "work-tasks.html"
    }
  },
  // 7 — Scorecard
  {
    label: "KNOW YOUR MARKET",
    messages: [
      "Founders know their competitive landscape."
    ],
    prototype: {
      title: "Agent Capability Scorecard",
      url: "agent-scorecard.html"
    }
  },
  // 8 — Close
  {
    final: true,
    messages: [
      "These prototypes weren't on a roadmap. They were built because the problems were interesting and the answers weren't obvious.",
      "Same reason you built Lobster on a weekend.",
      "Your last learning: <strong>\"You learn by using it yourself. No demo, spec, or review replaces daily use.\"</strong>"
    ],
    closing: "The surface layer needs a builder. Hema's ready."
  }
];

const chat = document.getElementById('chat');
let current = 0;

function render(index) {
  const s = steps[index];
  const el = document.createElement('div');
  el.className = s.final ? 'step final' : 'step';

  // Learning label
  if (s.label) {
    const lbl = document.createElement('div');
    lbl.className = 'label';
    lbl.textContent = s.label;
    el.appendChild(lbl);
  }

  // Agent message
  const agent = document.createElement('div');
  agent.className = 'agent';

  const dot = document.createElement('div');
  dot.className = 'dot';
  agent.appendChild(dot);

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  for (const msg of s.messages) {
    const p = document.createElement('p');
    p.innerHTML = msg;
    bubble.appendChild(p);
  }

  // Closing line (final step only)
  if (s.closing) {
    const cl = document.createElement('p');
    cl.className = 'closing';
    cl.textContent = s.closing;
    bubble.appendChild(cl);
  }

  agent.appendChild(bubble);
  el.appendChild(agent);

  // Prototype embed
  if (s.prototype) {
    const card = document.createElement('div');
    card.className = 'proto';

    const bar = document.createElement('div');
    bar.className = 'proto-bar';
    bar.innerHTML =
      '<span class="proto-name">' + s.prototype.title + '</span>' +
      '<a class="proto-link" href="' + s.prototype.url + '" target="_blank" rel="noopener">Open full ↗</a>';
    card.appendChild(bar);

    const iframe = document.createElement('iframe');
    iframe.src = s.prototype.url;
    iframe.loading = index <= 2 ? 'eager' : 'lazy';
    iframe.title = s.prototype.title;
    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
    card.appendChild(iframe);

    el.appendChild(card);
  }

  // Continue button (not on final step)
  if (!s.final) {
    const nav = document.createElement('div');
    nav.className = 'nav';

    const btn = document.createElement('button');
    btn.textContent = 'Continue →';
    btn.setAttribute('aria-label', 'Continue to next step');
    btn.onclick = function () {
      btn.disabled = true;
      current++;
      showWithTyping(current);
    };
    nav.appendChild(btn);

    const ctr = document.createElement('span');
    ctr.className = 'counter';
    ctr.textContent = (index + 1) + ' / ' + steps.length;
    nav.appendChild(ctr);

    el.appendChild(nav);
  }

  // Footnote on final step
  if (s.final) {
    const fn = document.createElement('div');
    fn.className = 'footnote';
    fn.textContent = 'Built with GitHub Copilot · April 2026';
    el.appendChild(fn);
  }

  chat.appendChild(el);

  // Animate in
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      el.classList.add('visible');
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

function showWithTyping(index) {
  // Show typing indicator, then render
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(typing);
  typing.scrollIntoView({ behavior: 'smooth', block: 'start' });

  setTimeout(function () {
    typing.remove();
    render(index);
  }, 700);
}

// Keyboard navigation: Enter or Space to continue
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') {
    // Don't trigger if user is interacting with an iframe
    if (document.activeElement && document.activeElement.tagName === 'IFRAME') return;
    var btn = chat.querySelector('.step:last-child .nav button:not(:disabled)');
    if (btn) {
      e.preventDefault();
      btn.click();
    }
  }
});

// Start
render(0);
</script>
</body>
</html>
